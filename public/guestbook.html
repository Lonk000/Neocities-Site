<style>
*, h1, h2, h3, h4, h5, h6 {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Karla', sans-serif;
}
 
body{
  background: rgb(91, 145, 106);
  font-size: 16px;
  color: #111;
  overflow-x: hidden;
}

/* Background wrapper */
.page-bg {
  position: fixed;
  top: 0;
  left: 50px; 
  right: 0;
  bottom: 0;
  background: url('https://i.imgur.com/CrmWR1m.png') no-repeat center center;
  background-size: cover;
  z-index: 0;
}

/* CRT Scanline Overlay */
body::before {
  content: " ";
  display: block;
  position: fixed;
  top: 0; left: 0; bottom: 0; right: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
  z-index: 999;
  background-size: 100% 4px, 6px 100%;
  pointer-events: none;
}

/* =========================================
   MAIN SITE LAYOUT (Your theme)
   ========================================= */
.sidewrapper{
position: fixed;
left: 0;
top: 0;
height: 100%;
z-index: 4;
}
 
.sidewrapper2{
display: flex;
flex-direction: row;
height: 100%;
}
 
.side1{
background-color: #000;
width: 150px;
height: 100%;
display: flex;
flex-direction: column;
text-align: center;
font-size: 25px;
font-family: 'PT Sans Narrow', sans-serif;
padding: 1.5rem 0 1.5rem 0;
overflow: scroll;
overflow-x: hidden;
}
 
.side2{
background-color: #000;
opacity: 0.7;
width: 50px;
height: 100%;
}
 
.headerwrapper{
width: 100%;
display: flex;
flex-direction: column;
position: relative;
z-index: 3;
}
 
.headerborder{
background: rgba(0, 0, 0, 0.8);
width: 100%;
height: 25px;
}
 
.header{
margin-left: 200px;
font-size: 56px;
padding-top: 3rem;
line-height: 38px;
font-family: 'Arial', sans-serif;
text-shadow: 3px 3px 0px #51815d;

}
 
.footerwrapper{
width: 100%;
background-color: #000;
opacity: 0.7;
height: 40px;

bottom: 0;
left: 0;
z-index: 2;
}
 
.container{
display: flex;
flex-direction: column;
padding: 3rem 3rem 5rem 3rem;
gap: 1rem;

z-index: 1;
}
 
.box{
background: rgba(255, 255, 255, 0.9);
border: 5px ridge #51815d;

z-index: 1;
}
 
.content{
padding: 1rem;
}
 
.subheaders{

color: #fff;

text-transform: uppercase;
font-size: 16px;
padding: 4px 8px;
}

/* Responsive Guestbook Frame Style */
.guestbook-frame-container {
  width: 100%;
  min-height: 600px;
  border: none;
  background: #fff;
}

.guestbook-iframe {
  width: 100%;
  height: 650px;
  border: 1px solid #97D9E9;
}
 
a{
color: #97D9E9;
text-decoration: none;
}
 
.side1 a{
color: #fff;
text-decoration: none;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 8px 0;
}

.side1 span {
font-size: 25px;
font-family: 'PT Sans Narrow', sans-serif;
margin-top: 2px;
}
 
a:visited{
color: #97D9E9;
}
 
.side1 a:visited{
color: #fff;
}
 
a:hover{

text-shadow: none;
}
 
.side1 a:hover{

color: #97D9E9;
}

font-size: 12px;

bottom: 0;
right: 0;

<!-- Custom Audio Script -->
<script>
    function playHoverSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + 0.05);
            
            gain.gain.setValueAtTime(0.03, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start();
            osc.stop(ctx.currentTime + 0.05);
        } catch(e) {}
    }

    function playCustomClickSound() {
        const clickAudio = document.getElementById('click-audio');
        if (clickAudio) {
            clickAudio.currentTime = 0;
            clickAudio.play().catch(e => console.log("Audio play restricted:", e));
        }
    }
</script>
 
<script>function playClickSound() { playCustomClickSound(); }</script>
