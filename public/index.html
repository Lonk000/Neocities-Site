<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lonk of Hyrool - Terminal</title>
 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
 
<style>
*, h1, h2, h3, h4, h5, h6 {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Share Tech Mono', monospace;
}
 
body{
  background: #020603;
  font-size: 16px;
  color: #111;
  overflow: hidden;
}

/* CRT Scanline Overlay */
body::before {
  content: " ";
  display: block;
  position: fixed;
  top: 0; left: 0; bottom: 0; right: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
  z-index: 999;
  background-size: 100% 4px, 6px 100%;
  pointer-events: none;
}

/* =========================================
   FULL-SCREEN VIGIL TERMINAL (RESPONSIVE)
   ========================================= */
#landing-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #020603;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 3vw;
}

.terminal-top {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
  max-width: 900px;
  width: 100%;
  max-height: 45vh;
  overflow-y: auto;
}

.boot-log {
  font-size: clamp(12px, 1.4vw, 15px);
  color: #5b916a;
  line-height: 1.5;
  white-space: pre-wrap;
  width: 100%;
}

.cursor {
  display: inline-block;
  background-color: #5b916a;
  width: 8px;
  height: 14px;
  animation: blink 0.8s infinite;
  vertical-align: middle;
  margin-left: 4px;
}

@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

/* Dead Center Layout for Logo, Title, Subtitle, and Button */
.terminal-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 0 20px;
}

.action-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  opacity: 0;
  animation: fadeInBtn 0.4s forwards;
  width: 100%;
}

.center-vigil-logo {
  width: clamp(100px, 15vw, 150px);
  height: auto;
  filter: drop-shadow(0 0 12px rgba(91, 145, 106, 0.6));
  margin-bottom: 6px;
}

.vigil-title {
  font-size: clamp(22px, 3vw, 32px);
  color: #ffffff;
  letter-spacing: 6px;
  font-weight: bold;
  margin-bottom: 4px;
  text-shadow: 0 0 12px rgba(91, 145, 106, 0.8);
  text-align: center;
}

.vigil-subtitle {
  font-size: clamp(11px, 1.3vw, 14px);
  color: #5b916a;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 24px;
  text-shadow: 0 0 8px rgba(91, 145, 106, 0.4);
  text-align: center;
}

.terminal-bottom {
  height: 40px;
  width: 100%;
}

.enter-btn {
  background: transparent;
  border: 2px solid #5b916a;
  color: #ffffff;
  padding: 12px 36px;
  font-size: clamp(14px, 1.5vw, 16px);
  font-family: 'Share Tech Mono', monospace;
  cursor: pointer;
  letter-spacing: 3px;
  transition: all 0.25s ease;
  text-transform: uppercase;
}

@keyframes fadeInBtn {
  to { opacity: 1; }
}

.enter-btn:hover {
  background: #5b916a;
  color: #fff;
  border-color: #97D9E9;
  box-shadow: 0 0 15px rgba(91, 145, 106, 0.5);
}

/* CRT Turn-On Animation Keyframes */
.tv-turn-on {
  animation: tvOn 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}

@keyframes tvOn {
  0% {
    transform: scale(1, 0.002);
    filter: brightness(30);
    background-color: #ffffff;
  }
  50% {
    transform: scale(1, 0.04);
    filter: brightness(15);
    background-color: #5b916a;
  }
  100% {
    transform: scale(1, 1);
    filter: brightness(1);
    background-color: transparent;
    opacity: 0;
    visibility: hidden;
  }
}
</style>
  </head>
 
<body>

<!-- FULL-SCREEN VIGIL TERMINAL -->
<div id="landing-overlay">
  <div class="terminal-top">
    <div class="boot-log" id="boot-text"><span class="cursor" id="cursor"></span></div>
  </div>
  
  <div class="terminal-center" id="btn-container"></div>
  <div class="terminal-bottom"></div>
</div>

<!-- Audio Elements -->
<audio id="startup-audio" src="https://raw.githubusercontent.com/Lonk000/Neocities-Site/main/public/sounds/start%20up.mp3"></audio>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const logBox = document.getElementById('boot-text');
        const cursor = document.getElementById('cursor');
        const btnContainer = document.getElementById('btn-container');

        const randomNum1 = Math.floor(1000 + Math.random() * 9000);
        const randomChars = Math.random().toString(36).substring(2, 5).toUpperCase();
        const sessionId = `#VGL-${randomNum1}-${randomChars}`;

        const bootSteps = [
            "VIGIL CORE BOOTLOADER v.4.0.1",
            "MEMORY CHECK........................[ 65536_TB_OK ]",
            "INITIALIZING VIGIL_KERNEL_01......[ DONE ]",
            "MOUNTING /DEV/SDA1 ON /ROOT.......[ OK ]",
            "VERIFYING ENCRYPTED_VOLUMES.......[ VERIFIED ]",
            "DETECTING COGNITIVE_HARDWARE.....[ NEURAL_LINK_READY ]",
            "SYNCING CELESTIAL_COORDINATES.....[ SYNCED ]",
            "INITIALIZING OMNI_UPLINK........[ SIGNAL_STABLE ]",
            "PULSING OMNI_BUS_HANDSHAKE........[ ACKNOWLEDGED ]",
            "DECRYPTING_UI_ASSETS..............[ READY ]",
            "LOADING INTERFACE_MODULE....[ SUCCESS ]",
            "CHECKING BIOMETRIC_CLEARANCE......[ CLEAR ]",
            "ESTABLISHING SECURE_TUNNEL.........[ ENCRYPTED ]",
            `REGISTERING SESSION_ID............[ ${sessionId} ]`,
            ">> SYSTEM READY. AWAITING USER AUTHENTICATION..."
        ];

        let index = 0;

        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, ctx.currentTime);
            gain.gain.setValueAtTime(0.05, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        } catch(e) {}

        const interval = setInterval(() => {
            if (index < bootSteps.length) {
                const currentText = logBox.innerHTML.replace(cursor.outerHTML, '');
                let prefix = index > 0 && index < bootSteps.length - 1 ? "> " : "";
                logBox.innerHTML = currentText + prefix + bootSteps[index] + "\n" + cursor.outerHTML;
                logBox.scrollTop = logBox.scrollHeight;
                index++;
            } else {
                clearInterval(interval);
                cursor.style.display = 'none';
                btnContainer.innerHTML = `
                  <div class="action-group">
                    <img src="https://iili.io/nY1l1R4.png" alt="Vigil Eye" class="center-vigil-logo">
                    <div class="vigil-title">VIGIL</div>
                    <div class="vigil-subtitle">A safer point of view.</div>
                    <button class="enter-btn" id="init-btn" onclick="startBootSequence()">INITIALIZE</button>
                  </div>
                `;
            }
        }, 110);
    });

    function startBootSequence() {
        const btn = document.getElementById('init-btn');
        btn.style.display = 'none';

        const startupAudio = document.getElementById('startup-audio');
        if (startupAudio) {
            startupAudio.currentTime = 0;
            startupAudio.play().catch(e => console.log("Audio play restricted:", e));
        }

        setTimeout(() => {
            document.getElementById('landing-overlay').classList.add('tv-turn-on');
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 500);
        }, 250);
    }
</script>
 
</body>
</html>
