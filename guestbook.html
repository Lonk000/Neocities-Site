<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Guestbook – My Notebook</title>

  <link rel="stylesheet" href="style.css" />

</head>

<body>

  <header>

    <h1>My Notebook</h1>

    <nav>

      <a href="index.html">Home</a>

      <a href="blog.html">Blog</a>

      <a href="guestbook.html">Guestbook</a>

    </nav>

  </header>

  <div class="container">

    <h2>Guestbook</h2>

    <form class="guestbook-form">

      <input type="text" name="name" placeholder="Your Name" required />

      <textarea name="message" placeholder="Leave a message..." rows="4" required></textarea>

      <button type="submit">Submit</button>

    </form>

    <div class="messages">

      <h3>Previous Messages</h3>

      <p><strong>Alice:</strong> Love the vibe of this site!</p>

      <p><strong>Bob:</strong> Just dropping by to say hi!</p>

    </div>

  </div>

</body>

</html>
